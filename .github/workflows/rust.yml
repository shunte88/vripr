name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vripr
            asset_name: vripr-linux-x86_64
            archive: tar.gz
            cargo_flags: --features onnx

          # macOS Apple Silicon (M1/M2 — native on macos-latest)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vripr
            asset_name: vripr-macos-arm64
            archive: tar.gz
            cargo_flags: --features onnx

          # macOS Intel — no ORT prebuilt binaries for x86_64-apple-darwin;
          # build without the onnx feature to keep CI green.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vripr
            asset_name: vripr-macos-x86_64
            archive: tar.gz
            cargo_flags: ""

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vripr.exe
            asset_name: vripr-windows-x86_64
            archive: zip
            cargo_flags: --features onnx

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # eframe on Linux needs X11/xcb headers for winit and GTK for native dialogs.
      # reqwest uses rustls-tls so OpenSSL is not required.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Test
        run: cargo test --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      # Binaries are statically linked and embed LGPL-2.1 (chromaprint-next's
      # FFmpeg-derived resampler) and MPL-2.0 (Symphonia) code, so the licence
      # texts and third-party notices travel inside the same archive as the
      # executable rather than being published as separate downloads.
      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          staging="staging/${{ matrix.asset_name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "$staging/"
          cp LICENSE LICENSE-LGPL-2.1 THIRD-PARTY-NOTICES.md README.md "$staging/"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ( cd staging && 7z a -tzip "../dist/${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}" )
          else
            tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C staging "${{ matrix.asset_name }}"
          fi
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.archive }}
          if-no-files-found: error

  # Create a GitHub Release and attach all platform binaries when a version tag is pushed.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten the per-artifact subdirectories so the archives attach directly.
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
